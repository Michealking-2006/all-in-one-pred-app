name: Extract page CSS

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/css/pages.css'
      - 'scripts/extract-page-css.js'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract page CSS
        run: node scripts/extract-page-css.js

      - name: Commit extracted CSS
        run: |
          if git diff --quiet -- assets/css/pages; then
            echo "No extracted CSS changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/pages
          git commit -m "chore(css): extract page styles"
          git push
