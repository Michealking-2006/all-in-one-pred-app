<article class="entity-page entity-page--player" data-entity="player">

  <header class="entity-header">
    <button type="button" class="entity-back" data-entity-back aria-label="Go back">‹</button>
    <div class="entity-logo-wrap">
      <img class="entity-logo" data-entity-logo alt="" hidden>
    </div>
    <div class="entity-heading">
      <p class="entity-type" data-entity-type>Player</p>
      <h1 data-entity-name>Player</h1>
      <p class="entity-place" data-entity-place hidden></p>
    </div>
  </header>

  <p class="entity-state" data-entity-status aria-live="polite" hidden></p>

  <main class="entity-content" data-entity-body>

    <section class="entity-section" aria-labelledby="player-profile-title">
      <h2 id="player-profile-title">Profile</h2>
      <div class="entity-stats">
        <span>Nationality<strong data-player-nationality>—</strong></span>
        <span>Age<strong data-player-age>—</strong></span>
        <span>Position<strong data-player-position>—</strong></span>
        <span>Team<strong data-player-team>—</strong></span>
      </div>
    </section>

    <section class="entity-section" aria-labelledby="player-stats-title">
      <h2 id="player-stats-title">Season statistics</h2>
      <div class="entity-stats">
        <span>Appearances<strong data-player-appearances>—</strong></span>
        <span>Goals<strong data-player-goals>—</strong></span>
        <span>Assists<strong data-player-assists>—</strong></span>
        <span>Rating<strong data-player-rating>—</strong></span>
      </div>
    </section>

  </main>

</article>
