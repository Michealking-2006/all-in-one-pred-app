<article class="entity-page entity-page--club" data-entity="club">

  <header class="entity-header">
    <button type="button" class="entity-back" data-entity-back aria-label="Go back">‹</button>
    <div class="entity-logo-wrap">
      <img class="entity-logo" data-entity-logo alt="" hidden>
    </div>
    <div class="entity-heading">
      <p class="entity-type" data-entity-type>Club</p>
      <h1 data-entity-name>Club</h1>
      <p class="entity-place" data-entity-place hidden></p>
    </div>
  </header>

  <p class="entity-state" data-entity-status aria-live="polite" hidden></p>

  <main class="entity-content" data-entity-body>

    <section class="entity-section" aria-labelledby="club-info-title">
      <h2 id="club-info-title">Club</h2>
      <div class="entity-stats">
        <span>Country<strong data-club-country>—</strong></span>
        <span>Founded<strong data-club-founded>—</strong></span>
        <span>Venue<strong data-club-venue>—</strong></span>
        <span>Capacity<strong data-club-capacity>—</strong></span>
      </div>
    </section>

    <section class="entity-section" aria-labelledby="squad-title">
      <h2 id="squad-title">Squad</h2>
      <div class="entity-grid" data-club-squad></div>
      <p class="entity-empty" data-club-squad-empty hidden>Squad unavailable.</p>
    </section>

    <section class="entity-section" aria-labelledby="club-fixtures-title">
      <h2 id="club-fixtures-title">Recent fixtures</h2>
      <div class="entity-fixtures" data-club-fixtures></div>
      <p class="entity-empty" data-club-fixtures-empty hidden>No recent fixtures.</p>
    </section>

  </main>

</article>
