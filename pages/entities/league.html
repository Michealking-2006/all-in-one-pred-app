<article class="entity-page entity-page--league" data-entity="league">

  <header class="entity-header">
    <button type="button" class="entity-back" data-entity-back aria-label="Go back">‹</button>
    <div class="entity-logo-wrap">
      <img class="entity-logo" data-entity-logo alt="" hidden>
    </div>
    <div class="entity-heading">
      <p class="entity-type" data-entity-type>League</p>
      <h1 data-entity-name>League</h1>
      <p class="entity-place" data-entity-place hidden></p>
    </div>
  </header>

  <p class="entity-state" data-entity-status aria-live="polite" hidden></p>

  <main class="entity-content" data-entity-body>

    <section class="entity-section" aria-labelledby="standings-title">
      <h2 id="standings-title">Standings</h2>
      <div class="entity-table">
        <div class="entity-table-row entity-table-head">
          <span>#</span><span>Club</span><span>MP</span><span>W</span><span>D</span><span>L</span><span>Pts</span>
        </div>
        <div data-league-standings></div>
      </div>
      <p class="entity-empty" data-league-standings-empty hidden>Standings unavailable.</p>
    </section>

    <section class="entity-section" aria-labelledby="fixtures-title">
      <h2 id="fixtures-title">Recent fixtures</h2>
      <div class="entity-fixtures" data-league-fixtures></div>
      <p class="entity-empty" data-league-fixtures-empty hidden>No recent fixtures.</p>
    </section>

    <section class="entity-section" aria-labelledby="scorers-title">
      <h2 id="scorers-title">Top scorers</h2>
      <div class="entity-list" data-league-scorers></div>
      <p class="entity-empty" data-league-scorers-empty hidden>Top scorers unavailable.</p>
    </section>

  </main>

</article>
