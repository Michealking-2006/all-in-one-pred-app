<section class="entity-page league-page" data-entity="league">
  <header class="entity-header">
    <button class="entity-back" type="button" data-entity-back aria-label="Go back">‹</button>
    <div class="entity-logo-wrap">
      <img class="entity-logo" data-league-logo alt="" hidden>
    </div>
    <div class="entity-heading">
      <h1 data-league-name>League</h1>
      <p data-league-country></p>
    </div>
  </header>

  <div class="entity-toolbar">
    <label for="league-season">Season</label>
    <select id="league-season" data-league-season aria-label="League season"></select>
  </div>

  <div class="entity-status" data-league-status aria-live="polite"></div>

  <section class="entity-content" aria-labelledby="standings-title">
    <div class="section-heading">
      <h2 id="standings-title">Standings</h2>
    </div>
    <div class="standings-table-wrap">
      <table class="standings-table">
        <thead><tr><th>#</th><th>Club</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead>
        <tbody data-league-standings></tbody>
      </table>
    </div>
  </section>

  <section class="entity-content" aria-labelledby="fixtures-title">
    <div class="section-heading"><h2 id="fixtures-title">Recent fixtures</h2></div>
    <div class="entity-list" data-league-fixtures></div>
  </section>

  <section class="entity-content" aria-labelledby="scorers-title">
    <div class="section-heading"><h2 id="scorers-title">Top scorers</h2></div>
    <div class="entity-list" data-league-scorers></div>
  </section>
</section>
