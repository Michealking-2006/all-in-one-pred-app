<div class="notifications-page" id="notificationsPage">

  <header class="notifications-header">

    <a
      href="/"
      class="notifications-back-btn"
      data-back
      aria-label="Back"
    >
      <span class="profile-icon profile-icon-back" aria-hidden="true"></span>
    </a>

    <h1>Notifications</h1>

    <button
      type="button"
      class="notifications-mark-all"
      id="notificationsMarkAll"
      hidden
    >
      Mark all read
    </button>

  </header>

  <main
    class="notifications-content"
    id="notificationsContent"
    data-auth-required="lock"
    data-auth-message="Log in to see your notifications."
  >

    <div class="notifications-list" id="notificationsList"></div>

    <div class="notifications-empty" id="notificationsEmpty" hidden>
      <p>You're all caught up — no notifications yet.</p>
    </div>

    <div class="notifications-skeleton" id="notificationsSkeleton">
      <div class="notification-row skeleton-card">
        <div class="skeleton skeleton-icon"></div>
        <div class="skeleton skeleton-text"></div>
      </div>
      <div class="notification-row skeleton-card">
        <div class="skeleton skeleton-icon"></div>
        <div class="skeleton skeleton-text"></div>
      </div>
      <div class="notification-row skeleton-card">
        <div class="skeleton skeleton-icon"></div>
        <div class="skeleton skeleton-text"></div>
      </div>
    </div>

  </main>

</div>

<app-script src="/assets/js/pages/notifications.js"></app-script>
