
  <main class="app">
    <header class="topbar">

        </div>
      </div>

      <div class="tabs-row" role="tablist" aria-label="Tips sections">
        <button id="list-all-prediction-type-btn" class="top-tab" type="button">All tips</button>
        <button class="top-tab" type="button">Smart Bet</button>
        <button class="slip-btn active" type="button">Slip Generator</button>
      </div>
    </header>

    <section class="content">
      <div class="card">
        <h2 class="section-title">Number of Games</h2>
        <div class="number-row" id="gamesRow">
          <button class="number-btn active" type="button">2</button>
          <button class="number-btn" type="button">3</button>
          <button class="number-btn" type="button">4</button>
          <button class="number-btn" type="button">5</button>
          <button class="number-btn" type="button">6</button>
          <button class="number-btn" type="button">7</button>
        </div>

        <div style="height:18px"></div>

        <h2 class="section-title" style="margin-bottom:14px;">Risk Level</h2>
        <div class="segmented" id="riskGroup">
          <button class="seg-btn active" type="button">Safe</button>
          <button class="seg-btn" type="button">Balanced</button>
          <button class="seg-btn" type="button">Risky</button>
        </div>

        <div style="height:18px"></div>

        <div class="toggle-card">
          <div class="toggle-copy">
            <div class="toggle-icon">📅</div>
            <div>
              <p class="toggle-title">Today's matches only</p>
              <p class="toggle-sub">Return a slip only for matches of today's date</p>
            </div>
          </div>
          
            <div class="checkbox-wrapper-7">
    <input class="tgl tgl-ios" id="app-matches-vip-toggle" type="checkbox" />
    <label class="tgl-btn" for="app-matches-vip-toggle">
  </div>
        </div>

        <div style="height:18px"></div>

        <h2 class="section-title" style="margin-bottom:14px;">Select Leagues</h2>
        <div class="chips" id="leagueChips">
          <button class="chip selected" type="button">All Leagues</button>
          <button class="chip" type="button">Major League Soccer (USA)</button>
          <button class="chip" type="button">UEFA Europa League</button>
          <button class="chip" type="button">England Premier League</button>
        </div>

        <div style="height:18px"></div>

        <h2 class="section-title" style="margin-bottom:14px;">Select Bet Types</h2>
        <div class="chips" id="betChips">
          <button class="chip selected" type="button">Winner</button>
          <button class="chip light" type="button">Over / Under 2.5</button>
          <button class="chip light" type="button">Corners Over</button>
          <button class="chip light" type="button">BTTS</button>
        </div>

        <div class="range-wrap">
          <div class="range-head">
            <span>Min Odds Per Match</span>
            <span class="range-value" id="oddsValue">1.10</span>
          </div>
          <input id="oddsRange" type="range" min="1.10" max="3.50" value="1.10" step="0.01" />
        </div>

        <button class="generate-btn" type="button">
          <span>⚡</span>
          <span>Generate Slip</span>
        </button>
      </div>

      

      </div>
    </section>
  </main>
