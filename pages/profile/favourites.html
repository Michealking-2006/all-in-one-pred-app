<div class="favourites-page" id="favouritesPage">

  <header class="favourites-header">

    <a
      href="/"
      class="favourites-back-btn"
      aria-label="Back"
    >
      <span
        class="profile-icon profile-icon-back"
        aria-hidden="true"
      ></span>
    </a>

    <h1>Favourites</h1>

  </header>


  <main
    class="favourites-content"
    data-auth-required="lock"
    data-auth-message="Log in to see your favourites."
  >

    <nav
      class="favourites-tabs"
      aria-label="Favourite categories"
    >

      <button
        class="favourites-tab is-active"
        type="button"
        data-favourite-tab="all"
        aria-selected="true"
      >
        All
      </button>

      <button
        class="favourites-tab"
        type="button"
        data-favourite-tab="matches"
        aria-selected="false"
      >
        Matches
      </button>

      <button
        class="favourites-tab"
        type="button"
        data-favourite-tab="players"
        aria-selected="false"
      >
        Players
      </button>

      <button
        class="favourites-tab"
        type="button"
        data-favourite-tab="leagues"
        aria-selected="false"
      >
        Leagues
      </button>

      <button
        class="favourites-tab"
        type="button"
        data-favourite-tab="teams"
        aria-selected="false"
      >
        Teams
      </button>

    </nav>


    <section
      class="favourites-list"
      id="favouritesList"
      aria-live="polite"
    ></section>


    <section
      class="favourites-empty"
      id="favouritesEmpty"
      hidden
    >

      <div
        class="favourites-empty-icon"
        aria-hidden="true"
      ></div>

      <h2>No favourites yet</h2>

      <p>
        Save leagues, clubs and players
        to find them quickly here.
      </p>

    </section>

  </main>

</div>

<app-script src="/assets/js/pages/favourites.js"></app-script>
