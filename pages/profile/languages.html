<div class="language-page" id="languagePage">

  <header class="language-header">

    <button
      class="language-back-btn"
      type="button"
      data-back
      aria-label="Go back"
    ></button>

    <h1>Language</h1>

  </header>


  <main class="language-content">

    <section class="language-intro">

      <h2>
        Choose your language
      </h2>

      <p>
        Select the language you want to use throughout Scoutwave.
      </p>

    </section>


    <section
      class="language-list"
      aria-label="Available languages"
    >

      <button
        class="language-option is-selected"
        type="button"
        data-language="en"
        data-language-name="English"
        aria-pressed="true"
      >
        <span class="language-option-info">
          <span class="language-option-name">
            English
          </span>

          <span class="language-option-native">
            English
          </span>
        </span>

        <span
          class="language-option-check"
          aria-hidden="true"
        ></span>
      </button>


      <button
        class="language-option"
        type="button"
        data-language="fr"
        data-language-name="French"
        aria-pressed="false"
      >
        <span class="language-option-info">
          <span class="language-option-name">
            French
          </span>

          <span class="language-option-native">
            Français
          </span>
        </span>

        <span
          class="language-option-check"
          aria-hidden="true"
        ></span>
      </button>


      <button
        class="language-option"
        type="button"
        data-language="es"
        data-language-name="Spanish"
        aria-pressed="false"
      >
        <span class="language-option-info">
          <span class="language-option-name">
            Spanish
          </span>

          <span class="language-option-native">
            Español
          </span>
        </span>

        <span
          class="language-option-check"
          aria-hidden="true"
        ></span>
      </button>


      <button
        class="language-option"
        type="button"
        data-language="de"
        data-language-name="German"
        aria-pressed="false"
      >
        <span class="language-option-info">
          <span class="language-option-name">
            German
          </span>

          <span class="language-option-native">
            Deutsch
          </span>
        </span>

        <span
          class="language-option-check"
          aria-hidden="true"
        ></span>
      </button>


      <button
        class="language-option"
        type="button"
        data-language="pt"
        data-language-name="Portuguese"
        aria-pressed="false"
      >
        <span class="language-option-info">
          <span class="language-option-name">
            Portuguese
          </span>

          <span class="language-option-native">
            Português
          </span>
        </span>

        <span
          class="language-option-check"
          aria-hidden="true"
        ></span>
      </button>


      <button
        class="language-option"
        type="button"
        data-language="it"
        data-language-name="Italian"
        aria-pressed="false"
      >
        <span class="language-option-info">
          <span class="language-option-name">
            Italian
          </span>

          <span class="language-option-native">
            Italiano
          </span>
        </span>

        <span
          class="language-option-check"
          aria-hidden="true"
        ></span>
      </button>

    </section>

  </main>

</div>

<app-script src="/assets/js/pages/language.js"></app-script>
