<div class="edit-profile-page" id="editProfilePage">

  <header class="edit-profile-header">

    <a
      href="/profile"
      class="app-profile-back-btn edit-profile-back-btn"
      aria-label="Back"
    >
      <span
        class="profile-icon profile-icon-back"
        aria-hidden="true"
      ></span>
    </a>

    <h1>Edit Profile</h1>

  </header>


  <main class="edit-profile-content">

    <section class="edit-profile-avatar-section">

      <div
        class="edit-profile-avatar"
        id="editProfileAvatarPreview"
      >
        <img
          src="/assets/icons/normal-pfp.jpeg"
          alt="Profile avatar"
          id="editProfileAvatarImage"
        >
      </div>

      <h2>Choose your avatar</h2>

      <p>
        Select an avatar for your profile.
      </p>


      <div
        class="edit-profile-avatar-grid"
        id="editProfileAvatarGrid"
      >

        <button
          class="avatar-option is-selected"
          type="button"
          data-avatar="/assets/icons/normal-pfp.jpeg"
          aria-label="Avatar 1"
          aria-pressed="true"
          data-auth-required="disable"
          data-auth-message="Please log in to change your avatar."
          data-auth-opacity="0.3"
        >
          <img
            src="/assets/icons/normal-pfp.jpeg"
            alt=""
          >
        </button>


        <button
          class="avatar-option"
          type="button"
          data-avatar="/assets/images/avatars/messi-avatar.png"
          aria-label="Avatar 2"
          aria-pressed="false"
          data-auth-required="disable"
          data-auth-message="Please log in to change your avatar."
          data-auth-opacity="0.3"
        >
          <img
            src="/assets/images/avatars/messi-avatar.png"
            alt="Messi avatar"
          >
        </button>


        <button
          class="avatar-option"
          type="button"
          data-avatar="/assets/images/avatars/ronaldo-avatar.png"
          aria-label="Avatar 3"
          aria-pressed="false"
          data-auth-required="disable"
          data-auth-message="Please log in to change your avatar."
          data-auth-opacity="0.3"
        >
          <img
            src="/assets/images/avatars/ronaldo-avatar.png"
            alt="Ronaldo avatar"
          >
        </button>


        <button
          class="avatar-option"
          type="button"
          data-avatar="/assets/images/avatars/harry-kane-avatar.png"
          aria-label="Avatar 4"
          aria-pressed="false"
          data-auth-required="disable"
          data-auth-message="Please log in to change your avatar."
          data-auth-opacity="0.3"
        >
          <img
            src="/assets/images/avatars/harry-kane-avatar.png"
            alt="Harry Kane avatar"
          >
        </button>


        <button
          class="avatar-option"
          type="button"
          data-avatar="/assets/images/avatars/mbappe-avatar.png"
          aria-label="Avatar 5"
          aria-pressed="false"
          data-auth-required="disable"
          data-auth-message="Please log in to change your avatar."
          data-auth-opacity="0.3"
        >
          <img
            src="/assets/images/avatars/mbappe-avatar.png"
            alt="Mbappe avatar"
          >
        </button>


        <button
          class="avatar-option"
          type="button"
          data-avatar="/assets/images/avatars/woman-avatar.png"
          aria-label="Avatar 6"
          aria-pressed="false"
          data-auth-required="disable"
          data-auth-message="Please log in to change your avatar."
          data-auth-opacity="0.3"
        >
          <img
            src="/assets/images/avatars/woman-avatar.png"
            alt="Woman avatar"
          >
        </button>

      </div>

    </section>


    <section class="edit-profile-form">

      <div class="edit-profile-field">

        <label for="editProfileUsername">
          Username
        </label>

        <input
          type="text"
          id="editProfileUsername"
          name="username"
          autocomplete="username"
          maxlength="30"
          placeholder="Enter your username"
          data-auth-required="disable"
          data-auth-message="Please log in to edit your username."
          data-auth-opacity="0.45"
        >

        <small>
          Your username is visible on your Scoutwave profile.
        </small>

      </div>


      <button
        class="edit-profile-save-btn"
        id="editProfileSaveBtn"
        type="button"
        data-auth-required="disable"
        data-auth-message="Please log in to save your profile."
        data-auth-opacity="0.45"
      >
        Save Changes
      </button>

    </section>


    <section class="edit-profile-danger">

      <div class="edit-profile-danger-info">

        <h2>Delete Account</h2>

        <p>
          Permanently delete your Scoutwave account and all
          associated account data.
        </p>

      </div>


      <button
        class="edit-profile-delete-btn"
        id="editProfileDeleteBtn"
        type="button"
        data-auth-required="disable"
        data-auth-message="Please log in to delete your account."
        data-auth-opacity="0.45"
      >
        Delete Account
      </button>

    </section>

  </main>

</div>


<app-script
  src="/assets/js/pages/edit-profile.js"
></app-script>
