<section id="predictionsPage" class="predictions-page">

  <!-- Header -->
  <header class="predictions-header">

    <div class="predictions-header-top">

      <div>
        

    <!-- Day Filter -->
    <div class="prediction-day-scroll">

      <button class="prediction-day active" data-day="today">
        <span>Today</span>
        <small>24</small>
      </button>

      <button class="prediction-day" data-day="tomorrow">
        <span>Tomorrow</span>
        <small>25</small>
      </button>

      <button class="prediction-day" data-day="yesterday">
        <span>Yesterday</span>
        <small>23</small>
      </button>

    </div>

    <!-- Market Filter -->
    <div class="prediction-market-scroll">

      <button class="prediction-market active">All</button>
      <button class="prediction-market">1X2</button>
      <button class="prediction-market">Over 1.5</button>
      <button class="prediction-market">Over 2.5</button>
      <button class="prediction-market">BTTS</button>
      <button class="prediction-market">Double Chance</button>
      <button class="prediction-market">Corners</button>
      <button class="prediction-market">Cards</button>

    </div>

  </header>

  <!-- Quick Stats -->
  <section class="prediction-summary">

    <div class="prediction-summary-card">
      <strong>46</strong>
      <span>Today's Matches</span>
    </div>

    <div class="prediction-summary-card">
      <strong>91%</strong>
      <span>Confidence</span>
    </div>

    <div class="prediction-summary-card">
      <strong>18</strong>
      <span>High Value</span>
    </div>

  </section>

  <!-- Featured Prediction -->
  <section class="featured-prediction-card">

    <div class="featured-prediction-top">

      <div class="featured-league">
        <img src="/assets/images/leagues/epl.png" alt="">
        <span>Premier League</span>
      </div>

      <span class="prediction-confidence high">92%</span>

    </div>

    <div class="featured-match-row">

      <div class="featured-team">
        <img src="/assets/images/teams/arsenal.png" alt="">
        <span>Arsenal</span>
      </div>

      <div class="featured-vs">
        <strong>VS</strong>
        <small>18:30</small>
      </div>

      <div class="featured-team">
        <img src="/assets/images/teams/chelsea.png" alt="">
        <span>Chelsea</span>
      </div>

    </div>

    <div class="featured-picks">

      <button class="prediction-pill active">1</button>
      <button class="prediction-pill">Over 2.5</button>
      <button class="prediction-pill">BTTS</button>

    </div>

  </section>

  <!-- Competition Sections -->

  <section class="prediction-league-section">

    <div class="prediction-league-title">
      <img src="/assets/images/leagues/epl.png" alt="">
      <span>Premier League</span>
    </div>

    <div class="prediction-list">

      <article class="prediction-card">

        <div class="prediction-card-top">
          <span>18:30</span>
          <span class="confidence medium">83%</span>
        </div>

        <div class="prediction-card-match">

          <div class="team">
            <img src="/assets/images/teams/liverpool.png" alt="">
            <span>Liverpool</span>
          </div>

          <div class="vs">VS</div>

          <div class="team">
            <img src="/assets/images/teams/tottenham.png" alt="">
            <span>Tottenham</span>
          </div>

        </div>

        <div class="prediction-options">
          <button>1</button>
          <button>Over 2.5</button>
          <button>BTTS</button>
        </div>

      </article>

      <article class="prediction-card">

        <div class="prediction-card-top">
          <span>21:00</span>
          <span class="confidence high">90%</span>
        </div>

        <div class="prediction-card-match">

          <div class="team">
            <img src="/assets/images/teams/mancity.png" alt="">
            <span>Man City</span>
          </div>

          <div class="vs">VS</div>

          <div class="team">
            <img src="/assets/images/teams/brighton.png" alt="">
            <span>Brighton</span>
          </div>

        </div>

        <div class="prediction-options">
          <button>1</button>
          <button>Over 3.5</button>
          <button>Home + BTTS</button>
        </div>

      </article>

    </div>

  </section>
