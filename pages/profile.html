<section id="profile-page" class="app-profile-page">

  <header class="app-profile-header">
    <a href="/" class="app-profile-back-btn" aria-label="Back">
      <span class="profile-icon profile-icon-back" aria-hidden="true"></span>
    </a>

    <h1 class="app-profile-title">Profile</h1>
  </header>


  <section class="app-profile-user-sec">

    <div class="app-profile-avatar-wrap">
      <img
        id="appProfileAvatar"
        class="app-profile-avatar"
        src="/assets/icons/normal-pfp.jpeg"
        alt="Profile">

      <button
        class="app-profile-avatar-edit-btn"
        type="button"
        aria-label="Change profile photo">
        <span class="profile-icon profile-icon-edit" aria-hidden="true"></span>
      </button>
    </div>

    <h2
      id="appProfileUsername"
      class="app-profile-username app-skeleton app-skeleton-w-120 app-skeleton-h-16 app-skeleton-rounded">
    </h2>

    <p
      id="appProfileMemberSince"
      class="app-profile-member-since app-skeleton app-skeleton-w-150 app-skeleton-h-12 app-skeleton-rounded">
    </p>

  </section>


  <section class="app-profile-group">

    <a href="/profile/premium" class="app-profile-item">
      <div class="app-profile-item-left">
        <span class="profile-icon profile-icon-premium" aria-hidden="true"></span>
        <span>Premium</span>
      </div>

      <span class="profile-icon profile-icon-chevron" aria-hidden="true"></span>
    </a>


    <a href="/profile/coins" class="app-profile-item">
      <div class="app-profile-item-left">
        <span class="profile-icon profile-icon-coins" aria-hidden="true"></span>

        <span>
          Coins
          <span
            class="coins-balance-el-profile-page app-skeleton app-skeleton-w-25 app-skeleton-h-10 app-skeleton-rounded-full">
          </span>
        </span>
      </div>

      <span class="profile-icon profile-icon-chevron" aria-hidden="true"></span>
    </a>

  </section>


  <section class="app-profile-group">

    <h3 class="app-profile-group-title">Account</h3>

    <a href="/profile/edit" class="app-profile-item">
      <div class="app-profile-item-left">
        <span class="profile-icon profile-icon-user" aria-hidden="true"></span>
        <span>Edit Profile</span>
      </div>

      <span class="profile-icon profile-icon-chevron" aria-hidden="true"></span>
    </a>


    <a href="/profile/favourites" class="app-profile-item">
      <div class="app-profile-item-left">
        <span class="profile-icon profile-icon-star" aria-hidden="true"></span>
        <span>My favourites</span>
      </div>

      <span class="profile-icon profile-icon-chevron" aria-hidden="true"></span>
    </a>


    <a href="/security/change-password" class="app-profile-item">
      <div class="app-profile-item-left">
        <span class="profile-icon profile-icon-password" aria-hidden="true"></span>
        <span>Change Password</span>
      </div>

      <span class="profile-icon profile-icon-chevron" aria-hidden="true"></span>
    </a>

  </section>


  <section class="app-profile-group">

    <h3 class="app-profile-group-title">Menu</h3>

    <a href="/news" class="app-profile-item">
      <div class="app-profile-item-left">
        <span class="profile-icon profile-icon-news" aria-hidden="true"></span>
        <span>News</span>
      </div>

      <span class="profile-icon profile-icon-chevron" aria-hidden="true"></span>
    </a>


    <button class="app-profile-item" type="button">
      <div class="app-profile-item-left">
        <span class="profile-icon profile-icon-theme" aria-hidden="true"></span>
        <span>Dark theme</span>
      </div>

      <span class="app-theme-switch">
        <input
          type="checkbox"
          id="app-theme-toggle">

        <label for="app-theme-toggle" aria-label="Toggle dark theme"></label>
      </span>
    </button>

  </section>


  <section class="app-profile-group">

    <h3 class="app-profile-group-title">Support</h3>

    <a href="" class="app-profile-item">
      <div class="app-profile-item-left">
        <span class="profile-icon profile-icon-help" aria-hidden="true"></span>
        <span>Help Centre</span>
      </div>

      <span class="profile-icon profile-icon-chevron" aria-hidden="true"></span>
    </a>


    <a href="" class="app-profile-item">
      <div class="app-profile-item-left">
        <span class="profile-icon profile-icon-warning" aria-hidden="true"></span>
        <span>Report Issue</span>
      </div>

      <span class="profile-icon profile-icon-chevron" aria-hidden="true"></span>
    </a>


    <a href="" class="app-profile-item">
      <div class="app-profile-item-left">
        <span class="profile-icon profile-icon-phone" aria-hidden="true"></span>
        <span>Contact us</span>
      </div>

      <span class="profile-icon profile-icon-chevron" aria-hidden="true"></span>
    </a>


    <a href="" class="app-profile-item">
      <div class="app-profile-item-left">
        <span class="profile-icon profile-icon-privacy" aria-hidden="true"></span>
        <span>Privacy policy</span>
      </div>

      <span class="profile-icon profile-icon-chevron" aria-hidden="true"></span>
    </a>


    <button class="app-profile-item" type="button">
      <div class="app-profile-item-left">
        <span class="profile-icon profile-icon-terms" aria-hidden="true"></span>
        <span>Terms of use</span>
      </div>

      <span class="profile-icon profile-icon-chevron" aria-hidden="true"></span>
    </button>


    <a href="" class="app-profile-item">
      <div class="app-profile-item-left">
        <span class="profile-icon profile-icon-about" aria-hidden="true"></span>
        <span>About</span>
      </div>

      <span class="profile-icon profile-icon-chevron" aria-hidden="true"></span>
    </a>


    <a href="/profile/languages" class="app-profile-item">
      <div class="app-profile-item-left">
        <span class="profile-icon profile-icon-language" aria-hidden="true"></span>
        <span>Language</span>
      </div>

      <span class="selected-language-profile-pg">English</span>
    </a>

  </section>


  <section class="app-profile-bottom-sec">
    <button
      id="appProfileAuthBtn"
      class="app-profile-auth-btn"
      type="button">
      <span>Login</span>
    </button>
  </section>

</section>

<app-script src="/assets/js/pages/profile.js"></app-script>
