<!-- ********************* PROFILE PAGE ********************* -->

<section id="profile-page" class="app-profile-page">

  <!-- ********************* HEADER ********************* -->

  <header class="app-profile-header">

    <a href="/" class="app-profile-back-btn" type="button">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <h1 class="app-profile-title">
      Profile
    </h1>

  </header>

  <!-- ********************* USER ********************* -->

  <section class="app-profile-user-sec">

    <div class="app-profile-avatar-wrap">

      <img
        id="appProfileAvatar"
        class="app-profile-avatar"
        src="/assets/icons/user-avatar.svg"
        alt="Profile">

      <button
        class="app-profile-avatar-edit-btn"
        type="button"
        aria-label="Change profile photo">

        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
          <path fill="currentColor" d="M4 20h4l10.5-10.5l-4-4L4 16zm16.7-9.3a1 1 0 0 0 0-1.4l-2-2a1 1 0 0 0-1.4 0l-1.3 1.3l4 4z"/>
        </svg>

      </button>

    </div>

    <h2
      id="appProfileUsername"
      class="app-profile-username">
      Guest037
    </h2>

    <p
      id="appProfileMemberSince"
      class="app-profile-member-since">
      Member
    </p>

  </section>

  <!-- ********************* ACCOUNT ********************* -->

  <section class="app-profile-group">

    <h3 class="app-profile-group-title">
      Account
    </h3>

    <button class="app-profile-item" type="button">

      <div class="app-profile-item-left">

        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 12a5 5 0 1 0-5-5a5 5 0 0 0 5 5m0 2c-4.4 0-8 2-8 4.5V21h16v-2.5c0-2.5-3.6-4.5-8-4.5"/>
        </svg>

        <span>Edit Profile</span>

      </div>

      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
        <path fill="currentColor" d="m9 18l6-6l-6-6"/>
      </svg>

    </button>

    <button class="app-profile-item" type="button">

      <div class="app-profile-item-left">

        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
          <path fill="currentColor" d="M17 1H7a2 2 0 0 0-2 2v18l7-3l7 3V3a2 2 0 0 0-2-2"/>
        </svg>

        <span>Saved Predictions</span>

      </div>

      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
        <path fill="currentColor" d="m9 18l6-6l-6-6"/>
      </svg>

    </button>

    <button class="app-profile-item" type="button">

      <div class="app-profile-item-left">

        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 17a2 2 0 0 0 2-2v-3.17l.59-.58A2 2 0 0 0 15 10V8a3 3 0 1 0-6 0v2a2 2 0 0 0 .41 1.25L10 11.83V15a2 2 0 0 0 2 2"/>
        </svg>

        <span>Change Password</span>

      </div>

      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
        <path fill="currentColor" d="m9 18l6-6l-6-6"/>
      </svg>

    </button>

  </section>

  <!-- ********************* SUPPORT ********************* -->

  <section class="app-profile-group">

    <h3 class="app-profile-group-title">
      Support
    </h3>

    <button class="app-profile-item" type="button">

      <div class="app-profile-item-left">

        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 2A10 10 0 1 0 22 12A10 10 0 0 0 12 2m1 15h-2v-2h2zm2.1-7.2l-.9.9A2.4 2.4 0 0 0 13 13h-2v-.5a3.4 3.4 0 0 1 1-2.4l1.2-1.2a1.5 1.5 0 1 0-2.6-1.1H8a4 4 0 1 1 7.1 2"/>
        </svg>

        <span>Help Centre</span>

      </div>

      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
        <path fill="currentColor" d="m9 18l6-6l-6-6"/>
      </svg>

    </button>

    <button class="app-profile-item" type="button">

      <div class="app-profile-item-left">

        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 2L1 21h22zm1 15h-2v-2h2zm0-4h-2V8h2z"/>
        </svg>

        <span>Report Issue</span>

      </div>

      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
        <path fill="currentColor" d="m9 18l6-6l-6-6"/>
      </svg>

    </button>

    <button class="app-profile-item" type="button">

      <div class="app-profile-item-left">

        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2m1 15h-2v-6h2zm0-8h-2V7h2z"/>
        </svg>

        <span>About</span>

      </div>

      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
        <path fill="currentColor" d="m9 18l6-6l-6-6"/>
      </svg>

    </button>

  </section>

  <!-- ********************* LOGOUT ********************* -->

  <section class="app-profile-bottom-sec">

    <button
      id="appProfileLogoutBtn"
      class="app-profile-logout-btn"
      type="button">

      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
        <path fill="currentColor" d="M16 17v-3h-5v-4h5V7l5 5zm-2 2H5V5h9v2H7v10h7z"/>
      </svg>

      <span>Log Out</span>

    </button>

  </section>

</section>
