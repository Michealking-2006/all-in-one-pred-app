<div class="card" style="padding-bottom:10px;">
  <div class="subhead">
    <h2>VIP Tips</h2>
  </div>
  
  <div class="league-tabs" id="leagueTabs">
    <button class="league-tab active" type="button">Winner</button>
    <button class="league-tab" type="button">Over / Under 2.5</button>
    <button class="league-tab" type="button">First Half Winner</button>
  </div>
  
  <div class="league-list">
    <article class="league-item">
      <button class="league-row" type="button">
        <img class="league-logo" src="https://upload.wikimedia.org/wikipedia/en/0/0c/MLS_crest_logo_RGB_gradient.svg" alt="MLS">
        <div class="league-name"><strong>USA:</strong> Major League Soccer</div>
        <div class="star">☆</div>
        <div class="count">14</div>
        <div class="chev">›</div>
      </button>
    </article>
    
    <article class="league-item">
      <button class="league-row" type="button">
        <img class="league-logo" src="https://upload.wikimedia.org/wikipedia/commons/0/06/USL_Championship_logo.svg" alt="USL Championship">
        <div class="league-name"><strong>USA:</strong> USL Championship</div>
        <div class="star">☆</div>
        <div class="count">7</div>
        <div class="chev">›</div>
      </button>
    </article>
    
    <article class="league-item">
      <button class="league-row" type="button">
        <img class="league-logo" src="https://upload.wikimedia.org/wikipedia/en/2/2d/MLS_Next_Pro_logo.png" alt="MLS Next Pro">
        <div class="league-name"><strong>USA:</strong> MLS Next Pro</div>
        <div class="star">☆</div>
        <div class="count">6</div>
        <div class="chev">›</div>
      </button>
    </article>
    
    <article class="league-item open">
      <button class="league-row" type="button">
        <img class="league-logo" src="https://upload.wikimedia.org/wikipedia/en/b/bb/UEFA_Europa_League_logo.svg" alt="Europa League">
        <div class="league-name"><strong>World:</strong> UEFA Europa League</div>
        <div class="star">☆</div>
        <div class="count"></div>
        <div class="chev">⌄</div>
      </button>
      
      <div class="market-strip">
        <button class="market-pill" type="button">Winner Home or Draw</button>
        <button class="market-pill" type="button">Winner Away or Draw</button>
        <button class="market-pill" type="button">Over 1.5</button>
      </div>
      
      <div class="match-card">
        <div class="match-top">🏆 Winner Home or Draw</div>
        <div class="match-body">
          <div class="team">
            <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/en/9/9a/FC_Qaraba%C4%9F_logo.svg" alt="Qarabag">
            <div class="team-name">Qarabag</div>
            <div class="odd">1.50</div>
          </div>
          
          <div class="center">
            <div class="score">0 - 0</div>
            <div class="time">Yesterday, 17:00</div>
            <div class="odd" style="opacity:.6">4.20 (X)</div>
          </div>
          
          <div class="team">
            <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/en/8/8f/PFC_CSKA_Sofia_logo.svg" alt="CSKA Sofia">
            <div class="team-name">CSKA Sofia</div>
            <div class="odd">5.25</div>
          </div>
        </div>
      </div>
      
      <div class="match-card" style="margin-top:0; margin-bottom:14px;">
        <div class="match-top">🏆 Winner Home or Draw</div>
        <div class="match-body">
          <div class="team">
            <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/en/3/39/Be%C5%9Fikta%C5%9F_J.K._logo.svg" alt="Besiktas">
            <div class="team-name">Beşiktaş</div>
            <div class="odd">1.62</div>
          </div>
          
          <div class="center">
            <div class="score">1 - 0</div>
            <div class="time">Yesterday, 19:00</div>
            <div class="odd" style="opacity:.6">3.90 (X)</div>
          </div>
          
          <div class="team">
            <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/en/5/5f/FC_Midtjylland_logo.svg" alt="Midtjylland">
            <div class="team-name">FC Midtjylland</div>
            <div class="odd">4.90</div>
          </div>
        </div>
      </div>
    </article>
  </div>
</div>
