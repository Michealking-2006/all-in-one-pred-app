<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scoutwave</title>
    <meta name="description" content="Football livescores, predictions, odds and stats in one place." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Scoutwave" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" />
    <link rel="stylesheet" href="/src/styles/theme.css" />
  </head>
  <body>
    <div id="root">
      <main id="boot-fallback" style="min-height:100dvh;display:grid;place-items:center;padding:24px;background:#fff;font-family:Arial,sans-serif;color:#111">
        <section style="width:min(100%,360px);text-align:center">
          <strong style="display:block;font-size:20px;margin-bottom:8px">Loading Scoutwave…</strong>
          <span id="boot-fallback-message" style="display:block;color:#777;font-size:13px">Starting the app</span>
        </section>
      </main>
    </div>
    <div id="toast-root"></div>
    <noscript>Scoutwave needs JavaScript to run.</noscript>

    <script>
      // Startup safety net only. Once the app has rendered (window.__scoutwaveBooted),
      // a stray error or rejected request must NOT replace the whole UI with a
      // fatal screen — it is logged and the app keeps working.
      (function () {
        function showBootError(message) {
          if (window.__scoutwaveBooted) {
            console.error("Scoutwave runtime error:", message);
            return;
          }
          var root = document.getElementById("root");
          if (!root) return;
          var safe = String(message || "The app could not be loaded.");
          root.innerHTML =
            '<main style="min-height:100dvh;display:grid;place-items:center;padding:24px;background:#fff;font-family:Arial,sans-serif;color:#111">' +
              '<section style="width:min(100%,380px);text-align:center">' +
                '<strong style="display:block;font-size:20px;margin-bottom:8px">Scoutwave could not start</strong>' +
                '<span style="display:block;color:#777;font-size:13px;line-height:1.5">Please reload the app. If the problem continues, the loading system has reported a JavaScript error.</span>' +
                '<button onclick="location.reload()" style="margin-top:18px;border:0;border-radius:12px;padding:12px 18px;background:#d50000;color:#fff;font-weight:700">Reload</button>' +
              '</section>' +
            '</main>';
          console.error("Scoutwave boot error:", safe);
        }
        window.__scoutwaveBootError = showBootError;
        window.addEventListener("error", function (event) {
          if (event && event.error) showBootError(event.error.message || event.message);
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          showBootError(reason && reason.message ? reason.message : reason);
        });
      })();
    </script>

    <script type="module" src="/src/App.js"></script>
  </body>
</html>
