    <script>
      // Set html[data-theme] before first paint, straight from localStorage,
      // so there is never a flash of the wrong theme. src/theme.js (loaded
      // with the app) takes over afterwards for live updates.
      (function () {
        try {
          var raw = localStorage.getItem("scoutwave.app.state.v2");
          var pref = "system";
          if (raw) {
            var saved = JSON.parse(raw);
            if (saved && (saved.theme === "light" || saved.theme === "dark" || saved.theme === "system")) pref = saved.theme;
          }
          var dark = pref === "dark" || (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          // Club colours: set the accent right away so there is no flash of red; src/clubTheme.js refines it.
          if (saved && saved.clubTheme && /^#[0-9a-f]{6}$/i.test(saved.clubTheme.primary || "")) document.documentElement.style.setProperty("--accent", saved.clubTheme.primary);
          document.documentElement.dataset.themePref = pref;
          // Lighter mode for low-end phones, decided before first paint (same rules as src/perf.js).
          var nav = navigator, mem = nav.deviceMemory, conn = nav.connection || {};
          var mode = saved && saved.perfMode || "auto";
          var low = mode === "on" || (mode !== "off" && ((typeof mem === "number" && mem <= 2) || (mem == null && nav.hardwareConcurrency <= 4 && /Android/i.test(nav.userAgent)) || conn.saveData === true || conn.effectiveType === "2g" || conn.effectiveType === "slow-2g"));
          if (low) document.documentElement.dataset.lowend = "1";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

    <script>
      // Startup safety net only. Once the app has rendered (window.__scoutwaveBooted),
      // a stray error or rejected request must NOT replace the whole UI with a
      // fatal screen — it is logged and the app keeps working.
      (function () {
        function showBootError(message) {
          if (window.__scoutwaveBooted) {
            console.error("Scoutwave runtime error:", message);
            return;
          }
          var root = document.getElementById("root");
          if (!root) return;
          var safe = String(message || "The app could not be loaded.");
          root.innerHTML =
            '<main style="min-height:100dvh;display:grid;place-items:center;padding:24px;background:#fff;font-family:Arial,sans-serif;color:#111">' +
              '<section style="width:min(100%,380px);text-align:center">' +
                '<strong style="display:block;font-size:20px;margin-bottom:8px">Scoutwave could not start</strong>' +
                '<span style="display:block;color:#777;font-size:13px;line-height:1.5">Please reload the app. If the problem continues, the loading system has reported a JavaScript error.</span>' +
                '<button onclick="location.reload()" style="margin-top:18px;border:0;border-radius:12px;padding:12px 18px;background:#d50000;color:#fff;font-weight:700">Reload</button>' +
              '</section>' +
            '</main>';
          console.error("Scoutwave boot error:", safe);
        }
        window.__scoutwaveBootError = showBootError;
        window.addEventListener("error", function (event) {
          if (event && event.error) showBootError(event.error.message || event.message);
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          showBootError(reason && reason.message ? reason.message : reason);
        });
      })();
    </script>
